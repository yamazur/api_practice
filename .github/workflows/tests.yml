name: API Tests

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist allure-pytest uvicorn fastapi

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "DEBUG=True" >> .env
          echo "Содержимое .env файла:"
          cat .env

      - name: Start API server
        run: |
          echo "Запускаем сервер на порту 8080..."
          
          # Проверим, какой файл main.py существует
          ls -la main.py || echo "main.py не найден"
          
          # Запускаем сервер и сохраняем логи
          uvicorn main:app --host 0.0.0.0 --port 8080 --log-level debug > server.log 2>&1 &
          SERVER_PID=$!
          echo "Сервер запущен с PID: $SERVER_PID"
          
          # Даем серверу время на запуск
          sleep 10
          
          # Проверяем, запущен ли процесс
          ps aux | grep uvicorn
          
          # Смотрим логи сервера
          echo "Логи сервера:"
          cat server.log || echo "Логов нет"
          
          # Проверяем, слушает ли порт 8080
          netstat -tlnp | grep 8080 || echo "Порт 8080 не слушает"
          
          # Пробуем сделать запрос к серверу
          echo "Пробуем подключиться к серверу..."
          curl -v http://localhost:8080/health || curl -v http://localhost:8080/docs || echo "Сервер не отвечает"

      - name: Run API tests in parallel
        run: |
          pytest -n auto -v --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/