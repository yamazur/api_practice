name: API Tests

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist allure-pytest uvicorn fastapi
          # ⬆️ добавила uvicorn и fastapi для запуска сервера

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "DEBUG=True" >> .env

      - name: Start API server
        run: |
          # Запускаем сервер в фоне
          uvicorn main:app --host 0.0.0.0 --port 8080 &
          # Даем серверу время на запуск
          sleep 5
          # Проверяем что сервер запустился (опционально)
          curl --fail http://localhost:8080/health || echo "Сервер запущен на порту 8080"

      - name: Run API tests in parallel
        run: |
          pytest -n auto -v --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/